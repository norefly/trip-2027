<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Trip 2027</title>
<style>
:root{--bg:#f1f6f7;--surface:#fff;--ink:#12303b;--muted:#506b75;--line:#d3e0e4;--accent:#0a6580;--on:#fff;--err:#8f3f17;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1d24;--surface:#15303a;--ink:#e6eff1;--muted:#9db6be;--line:#2a4651;--accent:#62bfd9;--on:#0d1d24;--err:#f3b995;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);word-break:keep-all;font:400 16px/1.6 "Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
form{width:min(360px,100%);display:grid;gap:12px}
h1{font-size:20px;margin:0;font-weight:600}
p{margin:0;color:var(--muted);font-size:15px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.keep{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
button{font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:var(--accent);color:var(--on);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{min-height:1.5em;color:var(--err);font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head>
<body>
<form id="f">
<h1>비밀번호가 필요한 페이지예요</h1>

<label class="keep"><input id="k" type="checkbox" checked> 이 기기에서 기억하기</label>
<button id="b" type="submit">열기</button>
<div id="msg" role="status"></div>
</form>

const KEY="trip-2027-key";
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=u=>btoa(String.fromCharCode.apply(null,u));
const dec=key=>crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.iv)},key,u8(D.data));
function show(buf){const html=new TextDecoder().decode(buf);document.open();document.write(html);document.close()}
async function derive(pass){
  const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:u8(D.salt),iterations:D.iter},m,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{
  let saved=null;
  try{saved=localStorage.getItem(KEY)}catch(e){}
  if(!saved)return;
  const form=document.getElementById("f");
  form.hidden=true;
  if(document.readyState!=="complete")await new Promise(r=>addEventListener("load",()=>setTimeout(r,0),{once:true}));
  try{
    const key=await crypto.subtle.importKey("raw",u8(saved),"AES-GCM",false,["decrypt"]);
    show(await dec(key));
  }catch(e){
    try{localStorage.removeItem(KEY)}catch(e2){}
    form.hidden=false;
  }
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const b=document.getElementById("b"),msg=document.getElementById("msg"),p=document.getElementById("p");
  b.disabled=true;msg.textContent="여는 중이에요";
  try{
    const key=await derive(p.value);
    const buf=await dec(key);
    if(document.getElementById("k").checked){
      try{localStorage.setItem(KEY,b64(new Uint8Array(await crypto.subtle.exportKey("raw",key))))}catch(e2){}
    }
    show(buf);
  }catch(err){
    msg.textContent="비밀번호가 맞지 않아요. 다시 입력해 주세요.";
    b.disabled=false;p.select();
  }
});
